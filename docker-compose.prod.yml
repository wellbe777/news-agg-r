services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: gunicorn hewsagg.wsgi:application --bind 0.0.0.0:8000 --workers=4 --threads=2
    env_file:
      - .env
      - .env.prod
    expose:
      - "8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    env_file:
      - .env
      - .env.prod
    expose:
      - "3000"

  nginx:
    image: nginx:1.25
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
