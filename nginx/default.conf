server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # React frontend (static)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Django backend proxied to Gunicorn
    location /api/ {
        proxy_pass http://backend_prod:8000/;
        # proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Consider adding the X-Forwarded-Proto header for HTTPS awareness
        # proxy_set_header X-Forwarded-Proto $scheme; 
    }

    # Static files from Django
    location /static/ {
        alias /app/staticfiles/;
        # Optional: add caching headers for better performance
        # expires 30d;
        # add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/media/;
    }
}
