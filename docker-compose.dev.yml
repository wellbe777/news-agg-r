services:
  backend:
    environment:
      RUNNING_IN_DOCKER: "1"
    container_name: backend_dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: >
      sh -c "
      ./wait-for-db.sh &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
  
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: celery -A config worker -l info
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: celery -A config beat -l info
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      ROLLUP_WASM: "true"
    depends_on:
      - backend

# Mount 
volumes:
  frontend_node_modules:

